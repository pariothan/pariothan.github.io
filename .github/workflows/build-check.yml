name: Build check

# The site is served straight from the branch, so generated files are
# committed. This fails if someone edits index.html, a post, CSS or JS
# without re-running `npm run build`.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generated files are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

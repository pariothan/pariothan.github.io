<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="A syntax tree for 'what did Lee see', with an arrow showing 'what' moving from the object position to the front, and the same tree in bracket notation underneath">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0a35a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#121212"/>
  <rect width="560" height="420" fill="url(#dots)"/>

  <!-- branches -->
  <g stroke="#d8d8d4" stroke-width="1.1" fill="none">
    <path d="M250 48 L120 88"/><path d="M250 48 L380 88"/>
    <path d="M380 113 L290 153"/><path d="M380 113 L450 153"/>
    <path d="M450 178 L385 218"/><path d="M450 178 L505 218"/>
    <path d="M505 243 L460 283"/><path d="M505 243 L540 283"/>
    <!-- category to word -->
    <path d="M120 113 L120 132"/><path d="M290 178 L290 197"/><path d="M385 243 L385 262"/><path d="M460 308 L460 327"/>
  </g>

  <!-- movement: out of the object position, along its own lane, up to the front -->
  <path d="M540 312 L540 372 L120 372 L120 160" fill="none" stroke="#f0a35a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/>

  <!-- labels -->
  <g font-family="'STIX Two Text', 'Latin Modern Roman', Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle" fill="#ececec">
    <text x="250" y="42" fill="#a5a5f5">CP</text>
    <text x="120" y="107" fill="#f0a35a">DP<tspan dy="5" font-size="12">1</tspan></text>
    <text x="380" y="107">C′</text>
    <text x="290" y="172">C</text>
    <text x="450" y="172">TP</text>
    <text x="385" y="237">DP</text>
    <text x="505" y="237" fill="#8fd19e">VP</text>
    <text x="460" y="302">V</text>
    <text x="540" y="302" fill="#f0a35a" font-style="italic">t<tspan dy="5" font-size="12" font-style="normal">1</tspan></text>
    <g font-style="italic">
      <text x="120" y="150" fill="#f0a35a">what</text>
      <text x="290" y="215">did</text>
      <text x="385" y="280">Lee</text>
      <text x="460" y="345">see</text>
    </g>
  </g>

  <!-- the bracket bar, which stays in sync with the tree -->
  <path d="M0 388.5 L560 388.5" stroke="#2c2c2c"/>
  <text x="16" y="408" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#b0b0ab">[CP <tspan fill="#f0a35a">[DP what]₁</tspan> [C′ [C did] [TP [DP Lee] <tspan fill="#8fd19e">[VP [V see] <tspan fill="#f0a35a">t₁</tspan>]</tspan>]]]</text>
</svg>

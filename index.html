<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuel Lederer</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --ink: #e8eaed;
        /* LCARS-inspired accents - refined */
        --accent-green: #7cb342;
        --accent-blue: #4285f4;
        --accent-purple: #9c27b0;
        --accent-yellow: #ff9800;
        --accent-red: #f44336;
        /* Panels */
        --card: #1a1a1a;
        --card-dark: #252525;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Quantico", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.3;
        font-weight: 400;
        text-rendering: optimizeLegibility;
        font-feature-settings: "liga" 0;
      }

      /* --- Layout --- */
      .wrap {
        min-height: 100svh;
        display: grid; /* ✅ turn grid on */
        grid-template-columns: 1fr 140px 56px; /* content | sidebar | name */
        gap: 8px;
        padding: 12px;
      }

      .content-frame {
        background: #141414;
        padding: 24px;
        min-height: 65svh;
        border: 1px solid #333;
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        position: relative;
      }

      .button-frame {
        border-radius: 0;
        height: 100%; /* ✅ fill sidebar column */
        justify-items: stretch; /* buttons expand */
        padding: 5px;
        display: grid;
        align-content: start; /* ✅ pin to top */
        gap: 8px;
      }

      /* --- Sidebar --- */
      .sidebar {
        display: grid;
        align-content: start;
      }

      .navbtn {
        appearance: none;
        background: var(--card);
        color: var(--accent-blue);
        width: 100%; /* ✅ fill sidebar width */
        min-height: 2.8em;
        padding: 10px 8px;
        font-size: 14px;
        font-weight: 500;
        text-align: right;
        cursor: pointer;
        border: 1px solid #333;
        font-family: "JetBrains Mono", "Fira Code", monospace;
        white-space: normal;
        word-break: break-word;
        transition: background 0.1s ease;
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
        position: relative;
      }

      .navbtn:hover {
        background: var(--card-dark);
        color: var(--accent-green);
      }

      .navbtn:active {
        background: var(--card-dark);
      }

      .navbtn[aria-current="page"] {
        background: var(--accent-green);
        color: #000;
      }

      .navbtn:focus {
        outline: 2px solid var(--accent-blue);
        outline-offset: 2px;
      }

      /* --- Vertical name column --- */
      .name-column {
        display: flex;
        justify-content: center;
        align-items: center;
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent-purple);
        white-space: nowrap;
      }

      /* --- Typography --- */
      h1,
      h2,
      h3 {
        margin: 0;
      }

      h1 {
        margin-top: 0.8em;
        margin-bottom: 0.5em;
        font-size: clamp(1.75rem, 3.5vw, 2.75rem);
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: var(--accent-green);
      }

      h2 {
        margin-top: 1.5em;
        margin-bottom: 0.4em;
        font-size: clamp(1.5rem, 3vw, 2.2rem);
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--accent-blue);
      }

      h3 {
        margin-top: 1.2em;
        margin-bottom: 0.4em;
        font-size: clamp(1.125rem, 2vw, 1.5rem);
        line-height: 1.4;
        font-weight: 600;
        letter-spacing: 0.005em;
        color: var(--accent-purple);
      }

      p {
        margin: 0 0 1.2em;
        color: var(--ink);
        font-size: clamp(1rem, 1.5vw, 1.1rem);
        line-height: 1.5;
      }

      a {
        color: var(--accent-yellow);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
      }

      a:hover {
        color: var(--accent-purple);
      }

      a:focus {
        outline: 2px solid var(--accent-blue);
        outline-offset: 2px;
      }

      ul {
        margin: 0 0 1.2em 1.5em;
        padding: 0;
      }
      ul li {
        margin: 0.4em 0;
        color: var(--accent-red);
        font-size: clamp(1rem, 1.5vw, 1.1rem);
        line-height: 1.4;
      }

      /* --- Footer --- */
      footer {
        margin-top: 2.5em;
        padding-top: 1.2em;
        border-top: 1px solid #333;
        font-size: 12px;
        opacity: 0.6;
        color: #888;
        font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      .headshot {
        float: right;
        max-width: 150px; /* adjust size */
        margin: 0 0 1.2em 1.5em; /* spacing from text */
        border: 2px solid #444;
        clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      }
      .screenshot {
        float: right;
        max-width: 500px; /* adjust size */
        margin: 0 0 1.2em 1.5em; /* spacing from text */
        border: 2px solid #444;
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      }
      /* --- Deprecated projects styling --- */
      .deprecated {
        opacity: 0.65;
        color: #888;
        padding: 1.2em;
        margin: 1.5em 0;
        border-left: 3px solid #555;
        background: rgba(80, 80, 80, 0.03);
        clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
      }
      .deprecated h3 {
        color: #999;
        margin-top: 0;
      }
      .deprecated a {
        color: #aaa;
        text-decoration-style: dotted;
      }


      /* --- Responsive --- */
      @media (max-width: 880px) {
        .wrap {
          grid-template-columns: 1fr; /* stack */
        }
        .name-column {
          display: none;
        } /* hide vertical name on small screens */
        .button-frame {
          height: auto;
        } /* let sidebar shrink */
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main id="content" class="content-frame" tabindex="-1" aria-live="polite">
        <!-- Default view injected by JS -->
      </main>

      <aside class="sidebar" aria-label="Section navigation">
        <aside class="button-frame">
          <button class="navbtn" data-view="me" aria-current="page">Me</button>
          <button class="navbtn" data-view="projects">Projects</button>
          <button class="navbtn" data-view="resume">Resume</button>
          <!--          <button class="navbtn" data-view="unresume">
<!--            What a resume can’t show
<!--          </button>-->
        </aside>
      </aside>

      <div class="name-column">颯 SAMUEL LEDERER</div>
    </div>

    <script>
      // --- Content templates ---
      const VIEWS = {
        me: `
        <article>
          <img src="./assets/images/headshot.png" alt="Headshot" class="headshot">
          <h1>My Site</h1>
          <h2><em>If you're looking for info on me this is certainly one place</em></h2>
          <p>Is there something specific you were looking for but can't find?</p>

          <h3>What I Do</h3>
          <p>Freelance linguist working at the intersection of language, data, and technology. Currently doing linguistic data annotation for NLP systems, but I use language science to solve complex problems across a pretty wide range of domains. Driven by curiosity. I never want to take the easy answer when I can look further.</p>

          <h3>Background</h3>
          <p>B.A. Linguistics from UMass Amherst with minors in Chinese and Biology. Full professional proficiency in Mandarin Chinese gained through immersive study in Shanghai. Experience in psycholinguistics research, ESL instruction, and academic library systems.</p>

          <h3>Technical Skills</h3>
          <p>Python (numpy, pandas, SciPy), R, SQL, data analysis, experimental design. Comfortable with syntax trees, phonological analysis, and corpus linguistics. Always building things for fun.</p>

          <p>contact:</p>
          <p><a href="https://github.com/pariothan">github</a></p>
          <p><a href="mailto:sflederer@pm.me+website">sflederer@pm.me</a></p>
          <footer>© <span id="year"></span> Samuel Lederer</footer>
        </article>
      `,
        projects: `
        <article>
          <h1>I do these for fun, but you can look</h1>
          <h3><a href="./projects/ai-aac" target="_blank">AI-AAC (Oct-4 Hackathon 2025)</a></h3>
          <p>This one wasn't for fun as much as for jumping on a brilliant idea thought up by my friend Liz when we were at a hackathon. Built at the Oct-4 Hackathon with <a href="https://www.linkedin.com/in/liz-m-weber/">Elizabeth Weber</a> (bioengineer & accessibility specialist) and <a href="https://www.linkedin.com/in/meetapandit/">Meeta Pandit</a> (data engineer). A Flask web app that helps generate contextual vocabulary and sentences for AAC (Augmentative and Alternative Communication) users. Uses LLMs for intelligent vocabulary generation, with optional image based context analysis, and a drag-and-drop sentence builder, with AI giving options so you can pick the nuanced meaning you meant to say. Combines my linguistics background with Liz Weber's bioengineering and accessibility expertise and Meeta Pandit's data engineering skills for a truly interdisciplinary project!</p>
          <h3><a href="./projects/chesstest">Funky Chess</a></h3>
          <p>Chess is all great and all, but the rules haven't changed much in hundreds of years. Boring. In Funky Chess, the rules change every game!</p>
          <h3><a href="./projects/gravity-sim/dist">Interactive n-body gravity simulation</a></h3>
          <p>Built this Newtonian physics simulator as a short hackathon project! Features real-time physics, better controls, and some visual effects. A complete rewrite that's much more polished than my earlier attempt. No relativity or quantum mechanics yet, sorry!</p>
          <h3>Sentiment analysis by etymological origin</h3>
          <p>Ever wondered about the lasting impacts of 11th century English socioeconomic conditions on how people complain about superhero movies? I have! More soon, but here's a sneak peak:</p>
          <img src="./assets/images/sigbreakdown.png" alt="a bar chart showing sentiment analysis by etymological origin" class="screenshot">
          <h3>Experimental <a href="./projects/letter-tree-puzzles">binary-tree word puzzles</a>.</h3>
          <p>Doing syntax in generative linguistics, making the trees was always the most fun part. It's kind of like a puzzle, seeing whether your theory can fit what you know has to come out of the bottom of the tree. (Why are syntax trees upside down?) Coming into the CS world, I realized that people here don't have as much fun treeing out things. So I made a puzzle, to simulate the experience for you guys! But I haven't really figured out how to make it a "game" yet. Stay tuned.</p>
          <div class="deprecated">
            <h3><em>Deprecated:</em> <a href="./projects/gravity-sim-legacy/">Early gravity experiment</a></h3>
            <p>My first attempt at n-body universal gravitation - an experiment with how far GPT-4 could go in writing physics simulations. Kept here for historical interest, but the new version above is much better.</p>
          </div>
          <h3><a href="./projects/langsim">Language Evolution Simulator</a></h3>
          <p>A very early prototype of a simulator intended to use community dynamics to model language usage and evolution. Language historians / historical linguists have lots of theories about how language particuarly changes over time, but without a time machine our "observational" data is limited to what happened to be written down. That's limiting for like, a number of reasons that you probably don't need me to list. But I was thinking, if we could simulate language communities, maybe we could see whether parameters these theories propose produce the results they intend to? It's the next best thing! Currently has support for simple toy with ~200 words, some basic phonotactic constraints, and word borrowing. Watch a new world of languages unfold before your eyes...</p>
          <img src="./assets/images/guess.png" alt="a map with colored squares each with a sequence of IPA letters" class="screenshot">
          <h3>Ever wished you could sit down with your friends and write a new episode of Seinfeld?</h3>
          <p>If you're Larry David that might be easy, but I tried to make it into a game, TTRPG style.</p>
          <h3><a href="./projects/chesstest">Funky Chess</a></h3>
          <p>Chess is all great and all, but the rules haven't changed much in hundreds of years. Boring. In Funky Chess, the rules change every game!</p>
        </article>
      `,
        resume: `
        <article>
          <h1>Samuel Lederer</h1>
          <p><strong>Data Linguist</strong></p>
          <p><a href="mailto:slederer@pm.me">slederer@pm.me</a> | 781-742-3477 | Seattle, WA</p>
          
          <h2>Languages</h2>
          <p>English (native), Mandarin Chinese (full professional proficiency)</p>
          
          <h2>Experience</h2>
          
          <h3><strong>Linguistic Data Annotator (Freelance)</strong> | Jul 2023 - Present</h3>
          <p><em>Various</em></p>
          <ul>
            <li>Utilize linguistic expertise in syntax, semantics, phonology, and sociolinguistics in conjunction with NLP to assess training pipelines for quality</li>
            <li>Check work of non-linguist annotators, ensuring accurate and descriptive linguistic principles are used</li>
          </ul>
          
          <h3><strong>Linguistics Department Library Supervisor</strong> | Aug 2021 - May 2023</h3>
          <p><em>University of Massachusetts</em></p>
          <ul>
            <li>Independently cataloged and organized collection of over 5,000 books, transforming a decades-unused collection into a searchable, and loanable library using spreadsheets, and personally written Python based library programs</li>
            <li>Following departmental strategic vision, executed a self directed plan with little supervision over the course of two years due to strong problem solving and project management skills</li>
            <li>Organized large sets of academic data to aid in research of several professors, tagging with metadata to ensure it would still be searchable once I left</li>
          </ul>
          
          <h3><strong>Research Assistant</strong> | Oct 2020 - May 2023</h3>
          <p><em>University of Massachusetts | GAP (Grammar and Processing) Lab, CSAAL (Center for the Study of African American English) Lab</em></p>
          <ul>
            <li>Aided in survey-based experiment design, collection of research data, data annotation and analysis, and theoretical work in psycholinguistics</li>
            <li>Designed and conducted psycholinguistic experiments, gathering participants and handling requirements to organize research efforts and obtain proper research authorization</li>
            <li>Analyzed data using R</li>
            <li>Annotated data for addition into CORAAL (Corpus of Regional African American Language) and aided in syntax, semantic, and phonemic analysis as well as POS tagging, taking care to maintain best practices that the data was maximally beneficial to later researchers</li>
          </ul>
          
          <h3><strong>ESL Instructor (Freelance / YMCA Boston)</strong> | Nov 2023 - Present</h3>
          <p><em>Various (Freelance)</em></p>
          <ul>
            <li>Maintain engaging and interactive classes to ensure students effectively grasp course materials</li>
            <li>Tailor teaching to students from diverse cultural backgrounds and different language levels</li>
            <li>Assess student progress and provide individualized support to foster development and remedy persistent language struggles</li>
          </ul>
          
          <h3><strong>Chinese Immersion (Shanghai)</strong> | June - December 2019</h3>
          <p><em>Shanghai University of Finance and Economics</em></p>
          <ul>
            <li>Spent six months entirely immersed in Mandarin Chinese in Shanghai</li>
            <li>Lived in a Chinese family, tutoring the seven-year old son as my host-brother</li>
            <li>Raised Chinese to HSK6 level and beyond, gaining full professional proficiency</li>
            <li>Built an intercultural skill cross-applicable to nearly all fields</li>
          </ul>
          
          <h2>Core Skills</h2>
          <p>SQL, Python (expert; numpy, pandas, SciPy), R, Microsoft Suite, deductive and analytical reasoning, communication and emotional intelligence, American-Chinese cultural exchange, Mandarin proficiency</p>
          
          <h2>Education</h2>
          <h3><strong>University of Massachusetts, Amherst</strong> | May 2023</h3>
          <p>B.A. Linguistics; Minors in Chinese and Biology</p>
        </article>
      `,
        //        unresume: `
        //        <article>
        //          <h1>Unresume</h1>
        //          <h3>Importance the resume format doesn't permit</h3>
        //          <p>Still, the purpose of a resume is to get things across quickly. So I'll be brief, to make my point. Just with breaking the format.</p>
        //          <ul>
        //            <li>I've been in some kind of therapy continuously since I was 10. Turns out, other people struggle just like I did, but mine got caught. So I have unusually very strong emotional intelligence and mental well-being skills.</li>
        //            <li>I have a lot of experience with neurodiversity, both personally and professionally. I am ADHD and have tons of experience with autism socially and professionally. This gives me unique power, and I think you know that, even if you're a neurotypical.</li>
        //            <li>I have exceptionally strong improvisational skills. I think, talk, and act fast and on my feet. I'm an improv performer in spare time. This is a skill I've had to intentionally develop my entire life, and gives me just as much if not more professional value than any typical skill.</li>
        //          </ul>
        //        </article>
        //      `,
      };

      const content = document.getElementById("content");
      const year = new Date().getFullYear();

      function render(view) {
        content.innerHTML = VIEWS[view] || VIEWS.me;
        const y = content.querySelector("#year");
        if (y) y.textContent = year;
        content.focus();
      }

      // Initial render
      render("me");

      // Wire sidebar buttons
      document.querySelectorAll(".navbtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".navbtn")
            .forEach((b) => b.removeAttribute("aria-current"));
          btn.setAttribute("aria-current", "page");
          render(btn.dataset.view);
        });
      });

      // Optional: deep-link via hash (#me, #resume, #unresume)
      const hash = location.hash.replace("#", "");
      if (hash && VIEWS[hash]) {
        document.querySelector(`.navbtn[data-view="${hash}"]`)?.click();
      }
    </script>
  </body>
</html>

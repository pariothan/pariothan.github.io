<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematical Principles - Gravity Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/projects/gravity-sim/assets/index-0kqcG0FM.js"></script>
    <link rel="stylesheet" crossorigin href="/projects/gravity-sim/assets/index-_un-6o2M.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent page scrolling when zooming over the 3D canvas
      document.addEventListener('DOMContentLoaded', function() {
        function preventCanvasScroll(event) {
          // Only prevent scroll when directly over a canvas element
          if (event.target.tagName === 'CANVAS') {
            event.preventDefault();
            // Note: We don't call stopPropagation() so the simulation can still handle zoom
          }
        }
        
        // Watch for canvas elements and add wheel prevention only to them
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'CANVAS') {
                node.addEventListener('wheel', preventCanvasScroll, { passive: false });
              }
              // Also check child nodes for canvas elements
              if (node.querySelectorAll) {
                const canvases = node.querySelectorAll('canvas');
                canvases.forEach(function(canvas) {
                  canvas.addEventListener('wheel', preventCanvasScroll, { passive: false });
                });
              }
            });
          });
        });
        
        // Start observing
        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
          
          // Check for existing canvas elements
          const existingCanvases = root.querySelectorAll('canvas');
          existingCanvases.forEach(function(canvas) {
            canvas.addEventListener('wheel', preventCanvasScroll, { passive: false });
          });
        }
      });
    </script>
  </body>
</html>

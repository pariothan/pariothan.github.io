<!-- index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Linguistic Tree Puzzles | Samuel Lederer</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <style>
      .line {
        position: absolute;
        height: 3px;
        background: linear-gradient(90deg, #ffaa00, #cc55ff);
        pointer-events: none;
        filter: drop-shadow(0 0 4px rgba(255, 170, 0, 0.6));
        opacity: 0.8;
      }
      
      .game-title {
        position: fixed;
        top: 20px;
        left: 20px;
        font-family: "Quantico", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #cc55ff;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(204, 85, 255, 0.5);
        z-index: 100;
      }
      
      .game-subtitle {
        position: fixed;
        top: 55px;
        left: 20px;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        color: rgba(245, 246, 250, 0.7);
        font-style: italic;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="game-title">Linguistic Tree Puzzles</div>
    <div class="game-subtitle">Binary Tree Word Construction</div>
    
    <div class="display-word" id="wordDisplay">
      Hover over nodes to see the word
    </div>
    
    <svg
      style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      "
    >
      <line
        x1="0"
        y1="0"
        x2="0"
        y2="0"
        class="link-line"
      />
    </svg>
    
    <div class="node" id="rootNode" style="margin-top: -150px; z-index: 10;">
      <input type="text" placeholder="_" maxlength="1" />
      <button class="add-btn" onclick="addChildNode(this)">+</button>
    </div>

    <div id="wordsList">
      <h3>Discovered Words</h3>
      <ul id="wordsListContent"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>

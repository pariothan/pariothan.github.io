    <style>
      /* Enhanced LCARS-inspired styling for gravity simulator */
      
      /* Enhanced button animations and glow effects */
      button, [role="button"] {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        position: relative;
        overflow: hidden;
      }
      
      button:hover, [role="button"]:hover {
        transform: translateY(-1px) !important;
        box-shadow: 
          0 0 15px rgba(153, 153, 51, 0.4),
          0 4px 20px rgba(0, 0, 0, 0.3) !important;
      }
      
      button:active, [role="button"]:active {
        transform: translateY(0) !important;
      }
      
      /* Enhanced slider styling */
      input[type="range"] {
        position: relative;
      }
      
      input[type="range"]:hover {
        filter: brightness(1.1) !important;
      }
      
      /* Pulse animation for active buttons */
      button[aria-pressed="true"], button.active {
        animation: lcarsGlow 2s ease-in-out infinite alternate !important;
      }
      
      @keyframes lcarsGlow {
        0% { box-shadow: 0 0 10px rgba(153, 153, 51, 0.3); }

      /* Enhanced typography with portfolio fonts */

  <body>
    <div id="root"></div>
    <script>
      // Prevent page scrolling when zooming over the 3D canvas
      document.addEventListener('DOMContentLoaded', function() {
        function preventCanvasScroll(event) {
          // Only prevent scroll when directly over a canvas element
          if (event.target.tagName === 'CANVAS') {
            event.preventDefault();
            // Note: We don't call stopPropagation() so the simulation can still handle zoom
          }
        }
        
        // Watch for canvas elements and add wheel prevention only to them
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'CANVAS') {
                node.addEventListener('wheel', preventCanvasScroll, { passive: false });
              }
              // Also check child nodes for canvas elements
              if (node.querySelectorAll) {
                const canvases = node.querySelectorAll('canvas');
                canvases.forEach(function(canvas) {
                  canvas.addEventListener('wheel', preventCanvasScroll, { passive: false });
                });
              }
            });
          });
        });
        
        // Start observing
        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
          
          // Check for existing canvas elements
          const existingCanvases = root.querySelectorAll('canvas');
          existingCanvases.forEach(function(canvas) {
            canvas.addEventListener('wheel', preventCanvasScroll, { passive: false });
          });
        }
      });
    </script>
  </body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Private demo</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <style>
    :root { --bg: #0a0a0a; --ink: #e8eaed; --card: #1a1a1a; --card-dark: #252525; --green: #7cb342; --yellow: #ff9800; --red: #f44336; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      background-image: radial-gradient(circle, rgba(160, 180, 100, 0.05) 1px, transparent 1px); background-size: 6px 6px;
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, monospace; }
    main { width: min(360px, calc(100vw - 32px)); background: var(--card); border: 1px solid #333; padding: 20px;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
    h1 { margin: 0 0 16px; font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--yellow); }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid #333; }
    input:focus, button:focus { outline: 2px solid var(--yellow); outline-offset: 2px; }
    button { padding: 10px 14px; font: inherit; font-size: 14px; color: var(--yellow); background: var(--card-dark); border: 1px solid #333; cursor: pointer; }
    button:hover { color: var(--green); }
    button:disabled, input:disabled { opacity: 0.5; cursor: default; }
    #status { min-height: 1.4em; margin: 14px 0 0; font-size: 12px; color: #9aa0a6; }
    #status.bad { color: var(--red); }
    #bar { height: 2px; margin-top: 10px; background: #333; }
    #bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width 0.15s linear; }
    a { color: #9aa0a6; font-size: 12px; }
    .back { display: block; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Private demo</h1>
    <form id="door" autocomplete="off">
      <input id="key" type="password" placeholder="Password" aria-label="Password" autocomplete="off" autofocus required />
      <button id="go" type="submit">Open</button>
    </form>
    <div id="bar"><i></i></div>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="../../#projects">&#8592; Back</a>
  </main>
  <script>
  (() => {
    const STORE = 'private-demo-key', PREFIX = 'private-demo-', ITER = 600000;
    const form = document.getElementById('door'), field = document.getElementById('key'), go = document.getElementById('go');
    const status = document.getElementById('status'), bar = document.querySelector('#bar i');
    const say = (text, bad = false) => { status.textContent = text; status.classList.toggle('bad', bad); };
    const busy = (on) => { field.disabled = go.disabled = on; };
    const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    let sealed = null;

    if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !('caches' in window) || !('DecompressionStream' in window)) {
      say('This browser cannot open the demo. Try a current Chrome, Edge or Firefox.', true); busy(true); return;
    }

    /** the sealed file, fetched once and kept while the page is open */
    async function payload() {
      if (sealed) return sealed;
      const res = await fetch('payload.bin', { cache: 'no-cache' });
      if (!res.ok) throw new Error('missing');
      const total = Number(res.headers.get('Content-Length')) || 0, reader = res.body.getReader(), chunks = [];
      let got = 0;
      for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (total) bar.style.width = `${Math.min(90, (got / total) * 90)}%`; }
      const all = new Uint8Array(got); let at = 0; for (const c of chunks) { all.set(c, at); at += c.length; }
      return (sealed = all);
    }

    async function open(password) {
      busy(true); say('Loading…'); bar.style.width = '2%';
      let data;
      try { data = await payload(); } catch { busy(false); bar.style.width = '0'; say('Could not load the demo. Try again in a moment.', true); return; }
      say('Unlocking…');
      let plain;
      try {
        if (new TextDecoder().decode(data.subarray(0, 4)) !== 'PDM1') throw new Error('format');
        const salt = data.subarray(12, 28), iv = data.subarray(28, 40), body = data.subarray(40);
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
      } catch {
        sessionStorage.removeItem(STORE);
        busy(false); bar.style.width = '0'; say('Wrong password.', true); field.value = ''; field.focus(); return;
      }
      try {
        bar.style.width = '94%';
        const raw = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
        const n = new DataView(raw.buffer).getUint32(0, true), index = JSON.parse(new TextDecoder().decode(raw.subarray(4, 4 + n))), start = 4 + n;
        const name = PREFIX + hex(data.subarray(4, 12));
        for (const old of await caches.keys()) if (old.startsWith(PREFIX)) await caches.delete(old);
        const cache = await caches.open(name), app = new URL('app/', location.href);
        await Promise.all(index.map((f) => cache.put(new URL(f.path, app).href, new Response(raw.subarray(start + f.offset, start + f.offset + f.size), { headers: { 'Content-Type': f.type, 'Content-Length': String(f.size) } }))));
        await navigator.serviceWorker.register('sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        bar.style.width = '100%';
        sessionStorage.removeItem(STORE);
        location.href = app.href;
      } catch {
        busy(false); bar.style.width = '0'; say('Something went wrong opening the demo. Reload and try again.', true);
      }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); if (field.value) open(field.value); });
    // arriving from the button on the main site: the password typed there is waiting
    let waiting = null; try { waiting = sessionStorage.getItem(STORE); } catch {}
    if (waiting) open(waiting);
  })();
  </script>
</body>
</html>
